services:
  - type: web
    name: safeher-backend
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: static_site
    name: safeher-admin-dashboard
    rootDir: admin-dashboard
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://safeher-ai-women-safety-intelligence-afpd.onrender.com
      - key: VITE_SOCKET_URL
        value: https://safeher-ai-women-safety-intelligence-afpd.onrender.com
